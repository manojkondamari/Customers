# Test profile - H2 Database + Mock Redis (YOUR VERSION + 3 LINES)

# Bean override (REQUIRED)
spring.main.allow-bean-definition-overriding=true
spring.main.banner-mode=off

# H2 In-Memory Database (FIXED!)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# FIXED: Force proper table creation order + ignore foreign key errors
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true  
# Mock Redis (KEEP)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Silence noise
logging.level.org.springframework.security=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.tool.schema=ERROR
logging.level.root=WARN
