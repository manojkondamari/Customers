spring.application.name=customer-service

spring.jpa.show-sql=true
spring.datasource.url=jdbc:mysql://localhost:3306/customers
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.context-path=/api
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api/v3/api-docs

logging.level.root=info
logging.level.com.vetconnect=debug
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL.hibernate=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

jwt.secret=your-secret-key-here-minimum-is-256-bits
jwt.expiration=86400000

# Allow Spring Boot to pick the "best" Redis config
